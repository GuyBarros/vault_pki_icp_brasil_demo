# Local laboratory. Vault runs in dev mode: it is unsealed, in memory, and
# uses the root token from lab.env. Restarting the Vault container wipes it.
# See the README before running this against anything else.

services:
  vault:
    image: docker.io/hashicorp/vault:1.20
    user: "0:0"
    env_file:
      - lab.env
    environment:
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    command: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  postgres:
    image: docker.io/library/postgres:16-alpine
    env_file:
      - lab.env
    volumes:
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/01-registros.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  vault-agent:
    image: docker.io/hashicorp/vault:1.20
    user: "0:0"
    command: ["agent", "-config=/vault/config/agent.hcl"]
    volumes:
      - ../agent:/vault/config:ro
      - ./secrets:/vault/approle:ro
      - rendered-secrets:/vault/secrets
    depends_on:
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-s", "/vault/secrets/db.json"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  app:
    build:
      context: ../../app
      dockerfile: Containerfile
    environment:
      SECRETS_DIR: /vault/secrets
      SECRETS_SOURCE: vault-agent
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: demo
      PORT: "8080"
      TLS_PORT: "8443"
    volumes:
      - rendered-secrets:/vault/secrets:ro
    ports:
      - "8080:8080"
      - "8443:8443"
    depends_on:
      postgres:
        condition: service_healthy
      vault-agent:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  rendered-secrets:
