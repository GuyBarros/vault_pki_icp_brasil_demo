apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-app
  namespace: vault-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: demo-app-tls
  namespace: vault-demo
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["tls-cert", "db-creds"]
    verbs: ["get"]
  - apiGroups: ["secrets.hashicorp.com"]
    resources: ["vaultdynamicsecrets"]
    resourceNames: ["db-creds"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: demo-app-tls
  namespace: vault-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: demo-app-tls
subjects:
  - kind: ServiceAccount
    name: demo-app
    namespace: vault-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: vault-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      serviceAccountName: demo-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo
          image: vault-pki-icp-brasil-demo:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8085
            - name: https
              containerPort: 8443
          env:
            - name: SECRETS_DIR
              value: /vault/secrets
            - name: SECRETS_SOURCE
              value: vault-secrets-operator
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: demo
            - name: PORT
              value: "8085"
            - name: TLS_PORT
              value: "8443"
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: secrets
              mountPath: /vault/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: secrets
          projected:
            sources:
              - secret:
                  name: db-creds
                  optional: true
                  items:
                    - key: db.json
                      path: db.json
              - secret:
                  name: tls-cert
                  optional: true
                  items:
                    - key: tls.json
                      path: tls.json
              - secret:
                  name: icp-cert
                  optional: true
                  items:
                    - key: icp.json
                      path: icp.json
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: vault-demo
spec:
  type: NodePort
  selector:
    app: demo-app
  ports:
    - name: http
      port: 8085
      targetPort: http
      nodePort: 30085
    - name: https
      port: 8443
      targetPort: https
      nodePort: 30443
