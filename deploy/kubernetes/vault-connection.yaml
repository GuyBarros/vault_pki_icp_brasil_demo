# Address the Vault Secrets Operator pods can reach.
# The Podman lab publishes Vault on the host at port 8200; from kind or
# Docker Desktop that is often http://host.docker.internal:8200.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: vault
  namespace: vault-demo
spec:
  address: http://vault.example:8200
  skipTLSVerify: true
