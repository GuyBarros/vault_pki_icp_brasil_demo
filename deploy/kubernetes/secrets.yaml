# The service certificate is issued by the PKI engine. The ICP-Brasil
# certificate is read from KV. Keep icp.json aligned with
# deploy/agent/templates/icp.json.tpl and deploy/nomad/demo.nomad.hcl.
# Transformations write the same JSON files the application reads.
# The application re-reads those files, so these resources do not roll the Deployment.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultDynamicSecret
metadata:
  name: db-creds
  namespace: vault-demo
spec:
  vaultAuthRef: demo
  namespace: demo
  mount: database
  path: creds/demo-app
  revoke: true
  # Renew late so the database card can turn yellow before the next role.
  # 90 is the highest value this operator accepts.
  renewalPercent: 90
  destination:
    create: true
    overwrite: true
    name: db-creds
    transformation:
      excludes:
        - ".*"
      templates:
        db.json:
          text: |
            {{- printf "{\"username\":%q,\"password\":%q}" (get .Secrets "username") (get .Secrets "password") -}}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultPKISecret
metadata:
  name: service-tls
  namespace: vault-demo
spec:
  vaultAuthRef: demo
  namespace: demo
  mount: pki_int
  role: demo-server
  commonName: demo.vault.local
  altNames:
    - localhost
  ipSans:
    - 127.0.0.1
  ttl: 1m
  format: pem
  expiryOffset: 5s
  revoke: false
  clear: true
  destination:
    create: true
    overwrite: true
    name: tls-cert
    transformation:
      excludes:
        - ".*"
      templates:
        tls.json:
          text: |
            {{- printf "{\"certificate\":%q,\"private_key\":%q,\"issuing_ca\":%q,\"serial_number\":%q,\"expiration\":%q}" (get .Secrets "certificate") (get .Secrets "private_key") (get .Secrets "issuing_ca") (get .Secrets "serial_number") (get .Secrets "expiration") -}}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: icp-brasil
  namespace: vault-demo
spec:
  vaultAuthRef: demo
  namespace: demo
  mount: kv
  type: kv-v2
  path: icp-brasil
  refreshAfter: 1m
  destination:
    create: true
    overwrite: true
    name: icp-cert
    transformation:
      excludes:
        - ".*"
      templates:
        icp.json:
          text: |
            {{- printf "{\"certificate\":%q,\"private_key\":%q,\"public_key\":%q,\"issuing_ca\":%q,\"ca_chain\":%q}" (get .Secrets "certificate") (get .Secrets "private_key") (get .Secrets "public_key") (get .Secrets "issuing_ca") (get .Secrets "ca_chain") -}}
