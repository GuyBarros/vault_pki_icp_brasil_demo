# Lab identity. Keep the certificate requests aligned with
# deploy/agent/templates and deploy/nomad/demo.nomad.hcl.
# Transformations write the same JSON files the application reads.
# The application re-reads those files, so these resources do not roll the Deployment.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultDynamicSecret
metadata:
  name: db-creds
  namespace: vault-demo
spec:
  vaultAuthRef: demo
  mount: database
  path: creds/demo-app
  revoke: true
  destination:
    create: true
    overwrite: true
    name: db-creds
    transformation:
      excludes:
        - ".*"
      templates:
        db.json:
          text: |
            {{- printf "{\"username\":%q,\"password\":%q}" (get .Secrets "username") (get .Secrets "password") -}}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultPKISecret
metadata:
  name: service-tls
  namespace: vault-demo
spec:
  vaultAuthRef: demo
  mount: pki_int
  role: demo-server
  commonName: demo.vault.local
  altNames:
    - localhost
  ipSans:
    - 127.0.0.1
  ttl: 72h
  format: pem
  expiryOffset: 1h
  revoke: true
  clear: true
  destination:
    create: true
    overwrite: true
    name: tls-cert
    transformation:
      excludes:
        - ".*"
      templates:
        tls.json:
          text: |
            {{- printf "{\"certificate\":%q,\"private_key\":%q,\"issuing_ca\":%q,\"serial_number\":%q,\"expiration\":%q}" (get .Secrets "certificate") (get .Secrets "private_key") (get .Secrets "issuing_ca") (get .Secrets "serial_number") (get .Secrets "expiration") -}}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultPKISecret
metadata:
  name: icp-a1
  namespace: vault-demo
spec:
  vaultAuthRef: demo
  mount: pki_icp
  role: a1-pessoa-fisica
  commonName: MARIA OLIVEIRA DEMO
  altNames:
    - maria.oliveira@demo.vault.local
  otherSans:
    - "2.16.76.1.3.1;utf8:11144477735"
  excludeCNFromSans: true
  ttl: 72h
  format: pem
  expiryOffset: 1h
  revoke: true
  clear: true
  destination:
    create: true
    overwrite: true
    name: icp-cert
    transformation:
      excludes:
        - ".*"
      templates:
        icp.json:
          text: |
            {{- printf "{\"certificate\":%q,\"private_key\":%q,\"issuing_ca\":%q,\"serial_number\":%q,\"expiration\":%q}" (get .Secrets "certificate") (get .Secrets "private_key") (get .Secrets "issuing_ca") (get .Secrets "serial_number") (get .Secrets "expiration") -}}
